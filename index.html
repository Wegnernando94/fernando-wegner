<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernando Wegner · Tecnologia, IA e DevOps</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#1b2838">
  <meta name="description" content="Fernando Wegner: tecnologia, inteligência artificial, DevOps e qualidade de software. Blog, mentoria e consultoria.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fb;
      --bg-soft: #edf1f6;
      --card: #ffffff;
      --ink: #1b2838;
      --muted: #687a8e;
      --line: #dbe3ec;
      --accent: #4a72a0;
      --accent-dark: #345a85;
      --shadow: 30, 55, 90;
      --bs-body-bg: var(--bg);
      --bs-body-color: var(--ink);
      --bs-body-font-family: 'Inter', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); }
    h1, h2, h3, .serif { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; letter-spacing: -.025em; }
    em { font-style: normal; }
    .display-3, .display-4, .display-5, .display-6 { font-weight: 600; letter-spacing: -.03em; }
    .navbar-brand { font-weight: 700; letter-spacing: -.02em; }
    section { padding: 6rem 0; scroll-margin-top: 60px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: .72rem; color: var(--accent); font-weight: 600; }
    .lead-muted { color: var(--muted); }

    .nav-wrap { background: rgba(246,248,251,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .navbar-brand { font-family: 'Manrope', sans-serif; font-size: 1.25rem; color: var(--ink); }
    .nav-link { color: var(--muted); font-size: .92rem; }
    .nav-link:hover { color: var(--accent); }

    .btn-main { background: var(--ink); color: var(--bg); border-radius: 999px; padding: .7rem 1.5rem; border: 0; }
    .btn-main:hover { background: var(--accent-dark); color: #fff; }
    .btn-ghost { border: 1px solid var(--ink); color: var(--ink); border-radius: 999px; padding: .7rem 1.5rem; }
    .btn-ghost:hover { background: var(--ink); color: var(--bg); }

    .hero { padding-top: 8rem; }
    .hero h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1.05; }
    .hero h1 em { color: var(--accent); }
    .portrait { width: 100%; max-width: 380px; aspect-ratio: 4/5; object-fit: cover; border-radius: 200px 200px 24px 24px; border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(var(--shadow),.35); }
    .chip { display: inline-block; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .25rem .8rem; font-size: .8rem; color: var(--muted); margin: 0 .35rem .5rem 0; }

    .soft { background: var(--bg-soft); }
    .card-b { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 2rem; height: 100%; transition: transform .25s, box-shadow .25s; }
    .card-b:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -24px rgba(var(--shadow),.4); }
    .num { font-family: 'Manrope', sans-serif; color: var(--accent); font-size: 1.1rem; }
    a.more { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 500; }
    a.more:hover { color: var(--accent-dark); }

    .talk-img { width: 100%; height: 100%; min-height: 380px; max-height: 520px; object-fit: cover; object-position: 50% 62%; border-radius: 18px; border: 1px solid var(--line); }
    .timeline { border-left: 1px solid var(--line); margin-left: .4rem; }
    .t-item { position: relative; padding: 0 0 2.2rem 2rem; }
    .t-item::before { content: ''; position: absolute; left: -6px; top: .45rem; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
    .t-date { font-size: .78rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .t-item ul { color: var(--muted); font-size: .93rem; padding-left: 1.1rem; }

    .contact-link { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-family: 'Manrope', sans-serif; font-size: 1.6rem; transition: padding .25s, color .25s; }
    .contact-link:hover { color: var(--accent); padding-left: .6rem; }
    .contact-link span.arrow { font-family: 'Inter'; font-size: 1.1rem; }
    .to-top { position: fixed; right: 1.25rem; bottom: 1.25rem; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.2rem; box-shadow: 0 10px 24px -12px rgba(var(--shadow),.45); opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .25s, transform .25s, background .25s, color .25s; z-index: 1030; }
    .to-top.show { opacity: 1; pointer-events: auto; transform: none; }
    .to-top:hover { background: var(--ink); color: var(--bg); }
    /* Animações de entrada (estilo slide) */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
    .reveal.from-left { transform: translateX(-40px); }
    .reveal.zoom { transform: scale(.85); }
    .reveal.in { opacity: 1; transform: none; }
    .timeline { position: relative; border-left: 0; }
    .timeline::before { content: ''; position: absolute; left: 0; top: 0; width: 1px; height: 0; background: var(--line); transition: height 2.2s ease .3s; }
    .timeline.in::before { height: 100%; }
    .t-item::before { transform: scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1) calc(var(--d, 0s) + .3s); }
    .t-item.in::before { transform: scale(1); }
    .page { animation: pageIn .6s ease; }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .t-item::before, .timeline::before { transition: none !important; opacity: 1; transform: none; }
      .timeline::before { height: 100%; }
      .page { animation: none; }
    }
    .cv-wrap { display: flex; align-items: center; gap: 3rem; flex-wrap: wrap; justify-content: center; }
    .cv-paper { position: relative; width: 190px; height: 250px; flex: none; }
    .cv-paper .sheet { position: absolute; inset: 0; background: #ffffff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 20px 40px -24px rgba(var(--shadow),.45); transition: transform .5s cubic-bezier(.2,.7,.2,1); }
    .cv-paper .sheet.back { transform: rotate(-7deg) translate(-10px, 6px); background: var(--bg-soft); }
    .cv-paper .sheet.front { transform: rotate(3deg); padding: 1.3rem 1.1rem; }
    .cv-paper:hover .sheet.back { transform: rotate(-12deg) translate(-22px, 8px); }
    .cv-paper:hover .sheet.front { transform: rotate(0deg) translateY(-8px); }
    .cv-paper .ln { height: 6px; border-radius: 3px; background: var(--line); margin-bottom: .55rem; }
    .cv-paper .ln.t { height: 10px; width: 70%; background: var(--ink); opacity: .8; }
    .cv-paper .ln.a { width: 40%; background: var(--accent); margin-bottom: 1rem; }
    .cv-paper .tag { position: absolute; right: -10px; bottom: 18px; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 600; letter-spacing: .1em; padding: .3rem .6rem; border-radius: 4px; }
    /* Blog */
    .search { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: .65rem 1.2rem; width: 100%; max-width: 340px; color: var(--ink); }
    .search:focus { outline: none; border-color: var(--accent); }
    .tag-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .3rem .9rem; font-size: .82rem; color: var(--muted); margin: 0 .4rem .5rem 0; transition: all .2s; }
    .tag-btn:hover, .tag-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .post-card { display: block; text-decoration: none; color: inherit; }
    .post-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; margin-bottom: 1.2rem; }
    .meta { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
    .article { max-width: 720px; margin: 0 auto; }
    .article .content { font-size: 1.08rem; line-height: 1.85; }
    .article .content h2, .article .content h3 { margin: 2.4rem 0 1rem; }
    .article .content a { color: var(--accent); }
    .article .content img { max-width: 100%; border-radius: 12px; margin: 1rem 0; }
    .article .content blockquote { border-left: 3px solid var(--accent); padding: .3rem 0 .3rem 1.3rem; margin: 2rem 0; font-family: 'Manrope', sans-serif; font-size: 1.3rem; color: var(--ink); }
    .article .content pre { background: var(--ink); color: var(--bg); padding: 1.2rem; border-radius: 12px; font-size: .88rem; overflow-x: auto; }
    .article .content code { background: var(--bg-soft); padding: .1rem .35rem; border-radius: 4px; font-size: .9em; color: var(--accent-dark); }
    .article .content pre code { background: none; padding: 0; color: inherit; }
    .article .content table { width: 100%; margin: 1.5rem 0; }
    .article .content th, .article .content td { border-bottom: 1px solid var(--line); padding: .5rem; }
    /* Mentoria */
    .mentor-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; object-position: 55% 30%; border-radius: 24px 24px 200px 24px; border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(var(--shadow),.35); }
    .plan { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 2.2rem; height: 100%; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
    .plan:hover { transform: translateY(-6px); box-shadow: 0 24px 50px -28px rgba(var(--shadow),.45); }
    .plan.featured { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .plan.featured .lead-muted, .plan.featured li { color: #a9b8c8; }
    .plan .price { font-family: 'Manrope', sans-serif; font-size: 2.8rem; line-height: 1; }
    .plan .price small { font-size: 1rem; font-family: 'Inter'; }
    .plan ul { list-style: none; padding: 0; margin: 1.5rem 0 2rem; flex-grow: 1; }
    .plan li { padding: .45rem 0 .45rem 1.6rem; position: relative; color: var(--muted); font-size: .95rem; }
    .plan li::before { content: '✓'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }
    .plan.featured .btn-main { background: var(--bg); color: var(--ink); }
    .plan.featured .btn-main:hover { background: var(--accent); color: #fff; }
    .badge-pop { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .9rem; border-radius: 999px; font-weight: 600; }
    .faq-item { border-bottom: 1px solid var(--line); }
    .faq-q { width: 100%; text-align: left; background: none; border: 0; padding: 1.4rem 0; display: flex; justify-content: space-between; gap: 1rem; font-family: 'Manrope', sans-serif; font-size: 1.25rem; color: var(--ink); }
    .faq-q span.ic { transition: transform .3s; color: var(--accent); font-family: 'Inter'; }
    .faq-item.open .faq-q span.ic { transform: rotate(45deg); }
    .faq-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
    .faq-item.open .faq-a { grid-template-rows: 1fr; }
    .faq-a > div { overflow: hidden; color: var(--muted); line-height: 1.75; }
    .faq-a p { padding-bottom: 1.4rem; margin: 0; }
    .coffee { width: 72px; height: 72px; color: var(--accent); }
    .coffee .steam { animation: steam 2.4s ease-in-out infinite; transform-origin: bottom; }
    .coffee .steam:nth-of-type(2) { animation-delay: .4s; }
    .coffee .steam:nth-of-type(3) { animation-delay: .8s; }
    @keyframes steam { 0%, 100% { opacity: .2; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-3px); } }
    .tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: .3rem; gap: .2rem; flex-wrap: wrap; justify-content: center; }
    .tabs button { border: 0; background: transparent; border-radius: 999px; padding: .55rem 1.4rem; color: var(--muted); font-weight: 500; transition: all .25s; }
    .tabs button.on { background: var(--ink); color: var(--bg); }
    .tab-panel { animation: tabIn .45s ease; }
    @keyframes tabIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .plan .dur { font-size: .82rem; color: var(--accent); font-weight: 600; letter-spacing: .03em; }
    .plan.featured .dur { color: #9cc0e6; }
    /* Contato */
    .status { display: inline-flex; align-items: center; gap: .55rem; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: .4rem 1rem; font-size: .85rem; color: var(--muted); }
    .status .dot { width: 9px; height: 9px; border-radius: 50%; background: #5a9a5f; box-shadow: 0 0 0 0 rgba(90,154,95,.6); animation: pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(90,154,95,0); } 100% { box-shadow: 0 0 0 0 rgba(90,154,95,0); } }
    .composer { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 2.2rem; box-shadow: 0 30px 60px -40px rgba(var(--shadow),.4); }
    .composer label { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin-bottom: .6rem; display: block; }
    .field { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: .6rem 0; font-size: 1.05rem; color: var(--ink); transition: border-color .25s; }
    .field:focus { outline: none; border-color: var(--accent); }
    textarea.field { resize: none; min-height: 110px; }
    .pick { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .45rem 1rem; font-size: .9rem; color: var(--ink); margin: 0 .45rem .55rem 0; transition: all .2s; }
    .pick:hover { border-color: var(--accent); }
    .pick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .send-row { display: flex; gap: .7rem; flex-wrap: wrap; }
    .channel { display: flex; align-items: center; gap: 1.1rem; padding: 1.15rem 1.3rem; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-decoration: none; color: var(--ink); transition: transform .25s, border-color .25s, box-shadow .25s; margin-bottom: .9rem; }
    .channel:hover { transform: translateX(6px); border-color: var(--accent); box-shadow: 0 16px 32px -24px rgba(var(--shadow),.5); color: var(--ink); }
    .channel .ico { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 1.35rem; background: var(--bg-soft); color: var(--accent); transition: background .25s, color .25s; }
    .channel:hover .ico { background: var(--accent); color: #fff; }
    .channel .tt { font-weight: 600; }
    .channel .sub { font-size: .85rem; color: var(--muted); }
    .channel .go { margin-left: auto; color: var(--muted); transition: transform .25s, color .25s; }
    .channel:hover .go { transform: translate(3px, -3px); color: var(--accent); }
    .copy-btn { border: 0; background: var(--bg-soft); color: var(--ink); border-radius: 999px; padding: .35rem .8rem; font-size: .8rem; margin-left: auto; }
    .copy-btn:hover { background: var(--ink); color: var(--bg); }
    .toast-b { position: fixed; left: 50%; bottom: 2rem; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: .7rem 1.3rem; border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none; transition: all .3s; z-index: 1040; }
    .toast-b.show { opacity: 1; transform: translate(-50%, 0); }
    .steps-mini { counter-reset: st; list-style: none; padding: 0; margin: 0; }
    .steps-mini li { counter-increment: st; display: flex; gap: 1rem; padding: .9rem 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
    .steps-mini li::before { content: counter(st); font-family: 'Manrope', sans-serif; color: var(--accent); font-size: 1.3rem; line-height: 1; min-width: 1.2rem; }
    /* Idiomas */
    .flag { width: 20px; height: 14px; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px rgba(var(--shadow), .15); vertical-align: -2px; }
    .lang-switch { position: relative; display: inline-block; }
    .lang-current { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .35rem .7rem; font-size: .75rem; font-weight: 600; color: var(--ink); letter-spacing: .04em; transition: border-color .2s; }
    .lang-current:hover { border-color: var(--accent); }
    .lang-current .chev { font-size: .65rem; color: var(--muted); transition: transform .25s; }
    .lang-switch.open .chev { transform: rotate(180deg); }
    .lang-menu { position: absolute; right: 0; top: calc(100% + .4rem); list-style: none; margin: 0; padding: .35rem; min-width: 150px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px -20px rgba(var(--shadow), .35); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1050; }
    .lang-switch.open .lang-menu { opacity: 1; transform: none; pointer-events: auto; }
    .lang-menu button { display: flex; align-items: center; gap: .6rem; width: 100%; border: 0; background: transparent; padding: .5rem .65rem; border-radius: 10px; font-size: .88rem; color: var(--ink); text-align: left; }
    .lang-menu button:hover { background: var(--bg-soft); }
    @media (max-width: 991px) { .lang-menu { left: 0; right: auto; } }
    /* Assinatura do header */
    .sig { display: inline-flex; align-items: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 1.02rem; font-weight: 600; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
    .sig:hover { color: var(--ink); }
    .sig .pr { color: var(--accent); margin-right: .5rem; transition: transform .25s; }
    .sig:hover .pr { transform: translateX(3px); }
    .sig .tx { display: inline-block; overflow: hidden; white-space: nowrap; width: 15ch; animation: typing 1.1s steps(15) .2s both; }
    .sig .dt { color: var(--accent); }
    .sig .cr { display: inline-block; width: .55ch; height: 1.1em; margin-left: 2px; background: var(--accent); animation: blink 1.1s step-end infinite; transform: translateY(1px); }
    @keyframes typing { from { width: 0; } to { width: 15ch; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .sig .tx { animation: none; } .sig .cr { animation: none; } }
    .type-cursor { display: inline-block; width: .08em; min-width: 3px; height: .9em; margin-left: .06em; background: var(--accent); vertical-align: -.08em; }
    .type-cursor.done { animation: blink 1.1s step-end infinite; }
    .type-ghost { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { .type-cursor.done { animation: none; } }
    .cv-btns { display: flex; gap: .75rem; flex-wrap: wrap; }
    .cv-btns .btn { white-space: nowrap; padding: .65rem 1.2rem; display: inline-flex; align-items: center; }
    @media (min-width: 576px) { .cv-btns { flex-wrap: nowrap; } }
    footer { border-top: 1px solid var(--line); padding: 2rem 0; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <script src="i18n.js"></script>
  <script type="text/babel">
    const LINKS = {
      github: 'https://github.com/wegnernando94',
      linkedin: 'https://www.linkedin.com/in/fernando-wegner-186235191',
      email: 'mailto:wegnernando@gmail.com',
    };

    // Link do WhatsApp com mensagem pronta, de acordo com o lugar do site
    const wa = text => 'https://wa.me/5541985066318?text=' + encodeURIComponent(text);

    // ---------- Idiomas ----------
    const LANGS = ['pt', 'en', 'es'];
    const LANG_NAMES = { pt: 'Português', en: 'English', es: 'Español' };
    const Flag = ({ lang }) => (
      <svg className="flag" viewBox="0 0 30 20" aria-hidden="true">
        {lang === 'pt' && <>
          <rect width="30" height="20" fill="#229e45" />
          <path d="M15 2.5 27 10 15 17.5 3 10z" fill="#f8e509" />
          <circle cx="15" cy="10" r="4.6" fill="#2b49a3" />
          <path d="M10.6 9.2c3-.9 6.3-.5 8.9 1" stroke="#fff" strokeWidth=".8" fill="none" />
        </>}
        {lang === 'en' && <>
          <rect width="30" height="20" fill="#fff" />
          {[0, 2, 4, 6, 8, 10, 12].map(i => <rect key={i} y={i * 20 / 13} width="30" height={20 / 13} fill="#b22234" />)}
          <rect width="13" height={20 / 13 * 7} fill="#3c3b6e" />
        </>}
        {lang === 'es' && <>
          <rect width="30" height="20" fill="#c60b1e" />
          <rect y="5" width="30" height="10" fill="#ffc400" />
        </>}

    // Título "digitado" letra por letra, com cursor piscando no fim.
    // O texto restante fica invisível para a altura do título não pular.
    function Typed({ parts, speed = 38, delay = 250 }) {
      const full = parts.join('');
      const reduce = React.useMemo(() => window.matchMedia('(prefers-reduced-motion: reduce)').matches, []);
      const [n, setN] = React.useState(reduce ? full.length : 0);
      React.useEffect(() => {
        if (reduce) return;
        setN(0);
        let id;
        const start = setTimeout(() => {
          id = setInterval(() => setN(v => { if (v >= full.length) { clearInterval(id); return v; } return v + 1; }), speed);
        }, delay);
        return () => { clearTimeout(start); clearInterval(id); };
      }, [full]);
      const cut = (str, from) => [str.slice(0, Math.max(0, Math.min(str.length, n - from))), str.slice(Math.max(0, Math.min(str.length, n - from)))];
      const [b0, b1] = cut(parts[0], 0);
      const [e0, e1] = cut(parts[1], parts[0].length);
      const [a0, a1] = cut(parts[2], parts[0].length + parts[1].length);
      const done = n >= full.length;
      return (
        <span aria-label={full}>
          <span aria-hidden="true">
            {b0}<em style={{color: 'var(--accent)'}}>{e0}</em>{a0}
            <span className={'type-cursor' + (done ? ' done' : '')}></span>
            <span className="type-ghost">{b1}<em>{e1}</em>{a1}</span>
          </span>
        </span>
      );
    }

              <div className="reveal zoom"><CoffeeIcon /></div>
              <h2 className="display-6 mt-3 mb-3 reveal" style={{'--d': '.15s'}}>{m.coffee}</h2>
              <div className="d-flex flex-wrap justify-content-center gap-3 mt-4 reveal" style={{'--d': '.3s'}}>
                <a href="#/contato/mentoria" className="btn btn-main">{m.request}</a>
                <a href={wa(m.waGeneral)} target="_blank" rel="noopener" className="btn btn-ghost">{t.common.whatsappCta}</a>
              </div>
            </div>
          </section>
        </>
      );
    }

    function Consultoria() {
      const { t } = useT();
      const c = t.consulting;
      const tabs = ['project', 'fixed', 'workshop'];
      const [tab, setTab] = React.useState('project');
      const toPlans = () => document.getElementById('valores').scrollIntoView({ behavior: 'smooth' });
      return (
        <>
          <section style={{paddingTop: '8rem'}}>
            <div className="container">
              <div className="row align-items-center g-5">
                <div className="col-lg-7">
                  <p className="eyebrow reveal">{c.eyebrow}</p>
                  <h1 className="display-4 mb-4"><Typed parts={c.title} /></h1>
                  <p className="lead-muted fs-5 mb-4 reveal" style={{'--d': '.3s'}}>{c.text}</p>
                  <div className="d-flex flex-wrap gap-3 reveal" style={{'--d': '.45s'}}>
                    <button className="btn btn-main" onClick={toPlans}>{c.seePrices}</button>
                    <a href="#/contato/consultoria" className="btn btn-ghost">{c.schedule}</a>
                  </div>
                </div>
                <div className="col-lg-5">
                  <img className="talk-img reveal zoom" style={{'--d': '.3s'}} src="assets/palestra.jpg" alt={c.imgAlt} />
                </div>
              </div>
            </div>
          </section>

          <section className="soft">
            <div className="container">
              <div className="row g-5 mb-5">
                <div className="col-lg-5">
                  <p className="eyebrow reveal">{c.focusEyebrow}</p>
                  <h2 className="display-6 reveal" style={{'--d': '.1s'}}>{c.focusTitle}</h2>
                </div>
                <div className="col-lg-7">
                  <p className="lead-muted fs-5 reveal" style={{'--d': '.2s'}}>{c.focus1}</p>
                  <p className="lead-muted reveal" style={{'--d': '.3s'}}>{c.focus2}</p>
                </div>
              </div>
              <p className="eyebrow reveal">{c.blocksEyebrow}</p>
              <div className="row g-4">
                {c.blocks.map(([ti, d], i) => (
                  <div className="col-md-6 col-lg-3" key={ti}>
                    <div className="card-b reveal" style={{'--d': (i * 0.07) + 's'}}>
                      <span className="num">0{i + 1}</span>
                      <h3 className="h5 mt-3">{ti}</h3>
                      <p className="lead-muted mb-0" style={{fontSize: '.95rem'}}>{d}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section id="valores">
            <div className="container">
              <div className="text-center mb-5">
                <p className="eyebrow reveal">{c.pricesEyebrow}</p>
                <h2 className="display-6 mb-4 reveal" style={{'--d': '.1s'}}>{c.pricesTitle}</h2>
                <div className="tabs reveal" style={{'--d': '.2s'}} role="tablist">
                  {tabs.map(k => <button key={k} role="tab" aria-selected={tab === k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{c.tabs[k]}</button>)}
                </div>
              </div>
              <div className="row g-4 justify-content-center tab-panel" key={tab}>
                {c.plans[tab].map(p => (
                  <div className={p.wide ? 'col-lg-7' : 'col-lg-5'} key={p.name}>
                    <div className={'plan position-relative' + (p.featured ? ' featured' : '')}>
                      <h3 className="h4 mb-1">{p.name}</h3>
                      <p className="lead-muted mb-4">{p.desc}</p>
                      <div className="price">{p.price}</div>
                      <small className="lead-muted mt-1">{p.note}</small>
                      <p className="dur mt-3 mb-0">⏱ {p.dur}</p>
                      <ul>{p.items.map(it => <li key={it}>{it}</li>)}</ul>
                      <a href={wa(p.quote ? c.waWorkshop : c.waPlan(c.tabs[tab], p.name, p.price, p.note))}
                        target="_blank" rel="noopener" className="btn btn-main">{p.quote ? c.requestQuote : c.wantThis}</a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section className="soft">
            <div className="container" style={{maxWidth: 820}}>
              <p className="eyebrow reveal">{t.common.faqEyebrow}</p>
              <h2 className="display-6 mb-4 reveal" style={{'--d': '.1s'}}>{t.common.faqTitle}</h2>
              <Faq items={c.faq} />
            </div>
          </section>

          <section className="text-center">
            <div className="container" style={{maxWidth: 680}}>
              <h2 className="display-6 mb-3 reveal">{c.ctaTitle}</h2>
              <p className="lead-muted fs-5 reveal" style={{'--d': '.15s'}}>{c.ctaText}</p>
              <div className="d-flex flex-wrap justify-content-center gap-3 mt-4 reveal" style={{'--d': '.3s'}}>
                <a href="#/contato/consultoria" className="btn btn-main">{c.ctaBtn}</a>
                <a href={wa(c.waGeneral)} target="_blank" rel="noopener" className="btn btn-ghost">{t.common.whatsappCta}</a>
              </div>
            </div>
          </section>
        </>
      );
    }

    function Contato({ topic: initial }) {
      const { t } = useT();
      const k = t.contact;
      const [topic, setTopic] = React.useState(k.topics[initial] ? initial : null);
      const [name, setName] = React.useState('');
      const [msg, setMsg] = React.useState('');
      const [toast, setToast] = React.useState('');
      const ready = topic && name.trim() && msg.trim();
      const text = k.compose(name.trim(), k.topics[topic] || '', msg.trim());
      const showToast = s => { setToast(s); setTimeout(() => setToast(''), 2200); };
      const copyEmail = e => {
        e.preventDefault();
        e.stopPropagation();
        const done = () => showToast(k.copied);
        if (navigator.clipboard) navigator.clipboard.writeText('wegnernando@gmail.com').then(done, () => showToast('wegnernando@gmail.com'));
        else showToast('wegnernando@gmail.com');
      };
      const channels = [
        { ico: 'bi-whatsapp', t: 'WhatsApp', sub: k.waSub, href: wa(k.waMsg) },
        { ico: 'bi-linkedin', t: 'LinkedIn', sub: k.liSub, href: LINKS.linkedin },
        { ico: 'bi-github', t: 'GitHub', sub: k.ghSub, href: LINKS.github },
      ];
      return (
        <>
          <section style={{paddingTop: '9rem', paddingBottom: '3rem'}}>
            <div className="container">
              <div className="status reveal mb-4"><span className="dot"></span>{k.status}</div>
              <h1 className="display-3 mb-3" style={{maxWidth: 820}}><Typed parts={k.title} /></h1>
              <p className="lead-muted fs-5 reveal" style={{'--d': '.3s', maxWidth: 600}}>{k.text}</p>
            </div>
          </section>

          <section style={{paddingTop: 0}}>
            <div className="container">
              <div className="row g-5">
                <div className="col-lg-7">
                  <div className="composer reveal" style={{'--d': '.2s'}}>
                    <div className="mb-4">
                      <label>{k.step1}</label>
                      {Object.entries(k.topics).map(([key, v]) => (
                        <button key={key} type="button" className={'pick' + (topic === key ? ' on' : '')} onClick={() => setTopic(key)}>{v}</button>
                      ))}
                    </div>
                    <div className="mb-4">
                      <label htmlFor="c-name">{k.step2}</label>
                      <input id="c-name" className="field" placeholder={k.namePh} value={name} onChange={e => setName(e.target.value)} />
                    </div>
                    <div className="mb-4">
                      <label htmlFor="c-msg">{k.step3}</label>
                      <textarea id="c-msg" className="field" placeholder={k.msgPh} value={msg} onChange={e => setMsg(e.target.value)} />
                    </div>
                    <div className="send-row">
                      <a className={'btn btn-main' + (ready ? '' : ' disabled')} aria-disabled={!ready}
                         href={ready ? wa(text) : undefined} target="_blank" rel="noopener">
                        <i className="bi bi-whatsapp me-2"></i>{k.sendWa}
                      </a>
                      <a className={'btn btn-ghost' + (ready ? '' : ' disabled')} aria-disabled={!ready}
                         href={ready ? 'mailto:wegnernando@gmail.com?subject=' + encodeURIComponent(k.mailSubject + k.topics[topic]) + '&body=' + encodeURIComponent(text) : undefined}>
                        <i className="bi bi-envelope me-2"></i>{k.sendMail}
                      </a>
                    </div>
                    {!ready && <p className="lead-muted mt-3 mb-0" style={{fontSize: '.85rem'}}>{k.fill}</p>}
                  </div>
                </div>

                <div className="col-lg-5">
                  <p className="eyebrow reveal">{k.direct}</p>
                  {channels.map((ch, i) => (
                    <a key={ch.t} className="channel reveal from-left" style={{'--d': (0.25 + i * 0.12) + 's'}} href={ch.href} target="_blank" rel="noopener">
                      <span className="ico"><i className={'bi ' + ch.ico}></i></span>
                      <span><span className="tt d-block">{ch.t}</span><span className="sub">{ch.sub}</span></span>
                      <i className="bi bi-arrow-up-right go"></i>
                    </a>
                  ))}
                  <a className="channel reveal from-left" style={{'--d': '.61s'}} href={LINKS.email}>
                    <span className="ico"><i className="bi bi-envelope"></i></span>
                    <span><span className="tt d-block">E-mail</span><span className="sub">wegnernando@gmail.com</span></span>
                    <button className="copy-btn" onClick={copyEmail}>{k.copy}</button>
                  </a>

                  <div className="mt-5 reveal" style={{'--d': '.7s'}}>
                    <p className="eyebrow">{k.nextEyebrow}</p>
                    <ol className="steps-mini">{k.next.map(n => <li key={n}>{n}</li>)}</ol>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <div className={'toast-b' + (toast ? ' show' : '')} role="status">{toast}</div>
        </>
      );
    }

    function ToTop() {
      const { t } = useT();
      const [show, setShow] = React.useState(false);
      React.useEffect(() => {
        const onScroll = () => setShow(window.scrollY > 400);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <button className={'to-top' + (show ? ' show' : '')} aria-label={t.common.backToTop}
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>↑</button>
      );
    }

    function useReveal(key) {
      React.useEffect(() => {
        const els = document.querySelectorAll('.reveal:not(.in), .reveal-line:not(.in)');
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, [key]);
    }

    function App() {
      const route = useRoute();
      const [lang, setLangState] = React.useState(detectLang);
      const t = window.I18N[lang];
      const setLang = l => { setLangState(l); try { localStorage.setItem('lang', l); } catch (e) {} };
      React.useEffect(() => { document.documentElement.lang = t.htmlLang; document.title = t.meta.title; }, [lang]);
      useReveal(route + lang);
      const page = route === 'sobre' ? <Sobre />
        : route === 'blog' ? <Blog />
        : route.startsWith('blog/') ? <Post slug={route.slice(5)} />
        : route === 'contato' || route.startsWith('contato/') ? <Contato topic={route.split('/')[1]} />
        : route === 'mentoria' ? <Mentoria />
        : route === 'consultoria' ? <Consultoria />
        : <Home />;
      return (
        <LangCtx.Provider value={{ t, lang, setLang }}>
          <Nav route={route} />
          <main className="page" key={route + lang} style={{minHeight: '70vh'}}>{page}</main>
          <footer><div className="container d-flex justify-content-between flex-wrap gap-2">
            <span>© {new Date().getFullYear()} Fernando Wegner</span><span className="d-flex gap-4">
              <a className="more" href={LINKS.github} target="_blank" rel="noopener">GitHub</a>
              <a className="more" href={LINKS.linkedin} target="_blank" rel="noopener">LinkedIn</a>
              <a className="more" href={wa(t.footer.waMsg)} target="_blank" rel="noopener">WhatsApp</a>
            </span>
          </div></footer>
          <ToTop />
        </LangCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
