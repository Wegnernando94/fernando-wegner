name: Atualizar índice do blog

on:
  push:
    paths:
      - 'posts/**.md'
      - 'scripts/build-posts.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-posts.mjs
      - name: Commit do index.json
        run: |
          if git diff --quiet posts/index.json; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          git commit -m "blog: atualiza índice de posts"
          git push
